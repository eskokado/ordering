spring:
  cache:
    type: redis
  datasource:
    url: jdbc:postgresql://localhost:5432/ordering
    username: postgres
    password: postgres
  jpa:
    show-sql: true
    format-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testdata
    user: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5432/ordering
  data:
    redis:
      host: localhost
      port: 6379
      password: algashop
      database: 1
      timeout: 20
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${algashop.integrations.authorization-server.url}
      client:
        provider:
          algashop-as:
            token-uri: ${algashop.integrations.authorization-server.url}/oauth2/token
        registration:
          algashop-ordering-service-client:
            provider: algashop-as
            client-id: algashop-ordering-service
            client-secret: secret123
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: products:read

  cloud:
    circuitbreaker:
      retry:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      productCatalogCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 25s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: TIME_BASED
        minimumNumberOfCalls: 5
  retry:
    instances:
      productCatalogCB:
        maxAttempts: 4
        waitDuration: 3s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - com.eskcti.algashop.ordering.infrastructure.adapters.in.web.exceptionhandler.GatewayTimeoutException
          - com.eskcti.algashop.ordering.infrastructure.adapters.in.web.exceptionhandler.BadGatewayException$ServerErrorException

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always

algashop:
  integrations:
    authorization-server.url: http://algashop-authorization-server:8081
    shipping.provider: RAPIDEX
    rapidex.url: http://localhost:8787
    product-catalog:
      url: http://localhost:8084
      oauth2-client-registration-id: algashop-ordering-service-client
