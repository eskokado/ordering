spring:
  datasource:
    url: ${DATASOURCE_JDBC_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  jpa:
    show-sql: true
  flyway:
    enabled: false
    locations: classpath:db/migration
    user: ${FLYWAY_USERNAME}
    password: ${FLYWAY_PASSWORD}
    url: ${DATASOURCE_JDBC_URL}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTHORIZATION_SERVER_URL}
      client:
        provider:
          algashop-as:
            token-uri: ${AUTHORIZATION_SERVER_URL}/oauth2/token
        registration:
          algashop-ordering-service-client:
            provider: algashop-as
            client-id: ${ORDERING_CLIENT_ID:algashop-ordering-service}
            client-secret: ${ORDERING_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: products:read

algashop:
  integrations:
    authorization-server.url: ${AUTHORIZATION_SERVER_URL}
    shipping.provider: RAPIDEX
    rapidex.url: ${RAPIDEX_URL}
    product-catalog:
      url: ${PRODUCT_CATALOG_URL}
      oauth2-client-registration-id: algashop-ordering-service-client
