spring:
  datasource:
    url: jdbc:h2:mem:ordering;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=ORDER,VALUE,KEY,YEAR,USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    format-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://algashop-authorization-server:8081
      client:
        provider:
          algashop-as:
            token-uri: http://localhost:8781/oauth2/token
        registration:
          algashop-ordering-service-client:
            provider: algashop-as
            client-id: algashop-ordering-service
            client-secret: secret123
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: products:read
  flyway:
    enabled: false

algashop:
  integrations:
    shipping.provider: FAKE
    rapidex.url: "http://localhost:8780"
    product-catalog:
      url: "http://localhost:8781"
      oauth2-client-registration-id: algashop-ordering-service-client
