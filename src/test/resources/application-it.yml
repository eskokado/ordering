spring:
  config:
    activate:
      on-profile: it
  cache:
    type: none
  datasource:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

algashop:
  integrations:
    shipping.provider: "FAKE"
    rapidex.url: "http://localhost:8780"
    product-catalog.url: "http://localhost:8781"
