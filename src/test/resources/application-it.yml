spring:
  config:
    activate:
      on-profile: it
  cache:
    type: none
  datasource:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        provider:
          algashop-as:
            token-uri: http://localhost:8781/oauth2/token
        registration:
          algashop-ordering-service-client:
            provider: algashop-as
            client-id: algashop-ordering-service
            client-secret: secret123
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: products:read

algashop:
  integrations:
    shipping.provider: "FAKE"
    rapidex.url: "http://localhost:8780"
    product-catalog:
      url: "http://localhost:8781"
      oauth2-client-registration-id: algashop-ordering-service-client
