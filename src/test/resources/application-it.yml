spring:
  config:
    activate:
      on-profile: it
  datasource:
    url: jdbc:postgresql://localhost:5432/ordering_test
    username: postgres
    password: postgres
    hikari:
      minimum-idle: 1
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5432/ordering_test

algashop:
  integrations:
    shipping.provider: "FAKE"
    rapidex.url: "http://localhost:8780"
    product-catalog.url: "http://localhost:8781"
