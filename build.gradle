buildscript {
    dependencies {
        classpath 'org.flywaydb:flyway-core:11.13.0'
        classpath 'org.flywaydb:flyway-database-postgresql:11.13.0'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springframework.cloud.contract' version '5.0.0'
    id 'org.flywaydb.flyway' version '11.20.0'
    id 'jacoco'
}

group = 'com.eskcti.algashop'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    main {
        java { exclude '.opencode/**' }
        resources { exclude '.opencode/**', '.agents/**' }
    }
    test {
        java { exclude '.opencode/**' }
        resources { exclude '.opencode/**', '.agents/**' }
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    mockitoAgent
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.0.0")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'commons-validator:commons-validator:1.10.1'
    implementation 'com.fasterxml.uuid:java-uuid-generator:5.2.0'
    implementation 'io.hypersistence:hypersistence-tsid:2.1.4'
    implementation 'org.modelmapper:modelmapper:3.2.6'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-verifier'
    constraints {
        testImplementation('io.rest-assured:rest-assured:6.0.0') {
            version {
                strictly '6.0.0'
            }
        }
        testImplementation('io.rest-assured:spring-mock-mvc:6.0.0') {
            version {
                strictly '6.0.0'
            }
        }
    }
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.boot:spring-boot-starter-cache-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation('org.springframework.cloud:spring-cloud-starter-contract-stub-runner') {
        exclude group: 'com.github.tomakehurst', module: 'wiremock-jre8-standalone'
    }
    testImplementation 'org.wiremock:wiremock-standalone:3.13.1'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.assertj:assertj-core:3.27.6'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    mockitoAgent('org.mockito:mockito-core:5.21.0') {transitive = false}
}
contracts {
    packageWithBaseClasses = "com.eskcti.algashop.ordering.contract.base"
}

tasks.named('contractTest') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(Test).configureEach {
    maxParallelForks = 1
    jvmArgs '-Djdk.attach.allowAttachSelf=true', '-XX:+EnableDynamicAgentLoading'
}

test {
    filter {
        excludeTestsMatching("*IT")
    }
    systemProperty 'spring.profiles.active', 'test'
    jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}
tasks.named('check') {
    dependsOn(test, integrationTest, contractTest)
}

tasks.register('integrationTest', Test) {
    description = 'Run integration tests.'
    group = 'verification'
    systemProperty 'spring.profiles.active', 'it'
    jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    shouldRunAfter test

    useJUnitPlatform()

    testLogging {
        events "passed"
    }

    filter {
        includeTestsMatching "*IT"
        excludeTestsMatching "*Test"
    }
}

bootJar {
    archiveFileName = 'ordering.jar'
    exclude '.opencode/**', '.agents/**'
}

tasks.register('dockerBuild', Exec) {
    description = 'Builds a multi-platform Docker image using Buildx'
    group = 'build'
    dependsOn('bootJar')
    workingDir project.rootDir
    commandLine 'docker', 'buildx', 'build', '--platform', 'linux/arm64/v8,linux/amd64',
            '--tag', 'algashop/ordering:dev', '.'
}

def jacocoCoverageExcludes = [
    '**/OrderingApplication.class',
    '**/DomainServiceScanConfig.class',
    '**/SpringDataAuditingConfig.class',
    '**/RapiDexAPIClientConfig.class',
    '**/ModelMapperConfig.class',
    '**/CreditCardId.class',
    '**/AlgaShopResourceUtils.class',
    '**/RedisCacheConfig.class',
    '.opencode/**',
    '.agents/**'
]

jacocoTestReport {
    dependsOn test, integrationTest, contractTest
    executionData(test, integrationTest, contractTest)
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoCoverageExcludes)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn test, integrationTest, contractTest
    executionData(test, integrationTest, contractTest)
    violationRules {
        rule {
            limit {
                minimum = 0.9
            }
        }
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoCoverageExcludes)
        }))
    }
}

check.dependsOn jacocoTestCoverageVerification